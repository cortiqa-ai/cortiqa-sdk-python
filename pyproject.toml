[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortiqa"
version = "0.1.1"
description = "Official Python client library for Cortiqa AI & Falin Foundation Models"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Cortiqa AI Team", email = "team@cortiqa.co" }
]
keywords = ["cortiqa", "ai", "llm", "falin", "agents", "machine-learning", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://cortiqa.co"
Documentation = "https://github.com/cortiqa-ai/cortiqa-docs"
Repository = "https://github.com/cortiqa-ai/cortiqa-sdk-python"
"Bug Tracker" = "https://github.com/cortiqa-ai/cortiqa-sdk-python/issues"

[tool.setuptools.packages.find]
include = ["cortiqa*"]
exclude = ["tests*"]
